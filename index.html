<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Doodle Drive</title>
    <meta name="description" content="Draw any vehicle with one finger. Press Go. Real physics does the rest. A free browser game for all ages." />
    <meta name="theme-color" content="#ffd447" />
    <meta property="og:title" content="Doodle Drive" />
    <meta property="og:description" content="Draw any vehicle with one finger. Press Go. Real physics does the rest." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://pratyushshivam.github.io/doodle-drive/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body data-state="draw">
    <canvas id="world" aria-label="The course"></canvas>

    <header class="top">
      <h1 class="brand" aria-label="Doodle Drive">
        <span class="word"><i>D</i><i class="o"></i><i class="o"></i><i>d</i><i>l</i><i>e</i></span>
        <span class="word"><i>D</i><i>r</i><i>i</i><i>v</i><i>e</i></span>
      </h1>
      <div class="top-right">
        <button id="course" class="chip" type="button" aria-haspopup="dialog">
          <b id="course-no">01</b><span id="course-name">Sunday Lane</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg>
        </button>
        <button id="mute" class="icon" type="button" aria-label="Sound on or off" aria-pressed="false">
          <svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" /><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12" /></svg>
          <svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" /><path d="M17 9l5 6M22 9l-5 6" /></svg>
        </button>
      </div>
    </header>

    <main id="draw" class="draw">
      <div class="sheet" id="sheet">
        <canvas id="pad" aria-label="Drawing pad. Draw a vehicle here."></canvas>
        <p class="prompt" id="prompt">Draw a car. <span>Circles become wheels.</span></p>
        <p class="nudge" id="nudge">No wheels yet. Draw a circle on it.</p>
        <div class="swatches" id="swatches" role="group" aria-label="Colour"></div>
      </div>
      <div class="tools">
        <div class="tool-row">
          <button id="undo" class="icon" type="button" aria-label="Undo">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5L3 10l5 5" /><path d="M3 10h11a5 5 0 010 10h-4" /></svg>
          </button>
          <button id="clear" class="icon" type="button" aria-label="Clear">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13" /></svg>
          </button>
          <div class="starters" id="starters" role="group" aria-label="Ready-made doodles"></div>
        </div>
        <button id="go" class="go" type="button"><span>Go</span></button>
      </div>
    </main>

    <section id="hud" class="hud" aria-hidden="true">
      <div id="zone" class="zone"></div>
      <div class="hud-top">
        <button id="redraw" class="pill" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l4-1L19 8l-3-3L5 16l-1 4z" /></svg><span>Redraw</span>
        </button>
        <div class="clock">
          <output id="time">0.00</output>
          <div class="track"><i id="dot"></i><b></b></div>
        </div>
        <button id="retry" class="icon" type="button" aria-label="Start again">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12a7 7 0 107-7H7" /><path d="M10 2L7 5l3 3" /></svg>
        </button>
      </div>
      <div class="pedal back" id="pedal-back" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M15 5l-8 7 8 7z" /></svg>
      </div>
      <div class="pedal fwd" id="pedal-go" aria-hidden="true"><em id="hold">Hold</em><svg viewBox="0 0 24 24"><path d="M8 5l10 7-10 7z" /></svg></div>
      <div class="stuck" id="stuck">
        <b>Stuck?</b>
        <button id="stuck-redraw" class="pill small" type="button">Redraw</button>
        <button id="stuck-share" class="pill small ghost" type="button">Share the flop</button>
      </div>
    </section>

    <section id="result" class="result" role="dialog" aria-modal="true" aria-labelledby="result-title" hidden>
      <div class="result-card">
        <p class="result-course" id="result-course"></p>
        <h2 id="result-title"></h2>
        <p class="result-big"><span id="result-num"></span><small id="result-unit"></small></p>
        <div class="stars" id="stars" aria-hidden="true"></div>
        <p class="result-note" id="result-note"></p>
        <img id="card" class="card-thumb" alt="A picture of your doodle with its result" />
        <div class="result-actions">
          <button id="next" class="go small" type="button"><span>Next course</span></button>
          <button id="share" class="pill" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M8 8l4-4 4 4M5 13v6h14v-6" /></svg><span id="share-label">Share</span>
          </button>
          <button id="again" class="pill" type="button">Again</button>
          <button id="result-redraw" class="pill" type="button">Redraw</button>
        </div>
      </div>
    </section>

    <section id="courses" class="courses" role="dialog" aria-modal="true" aria-label="Courses" hidden>
      <div class="courses-head">
        <h2>Courses</h2>
        <button id="courses-close" class="icon" type="button" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </div>
      <div class="course-grid" id="course-grid"></div>
    </section>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <noscript>Doodle Drive needs JavaScript to run.</noscript>
  </body>
</html>
